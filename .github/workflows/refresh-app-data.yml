# Refresh the Time Series Explorer's data from MERMAID
#
# Runs R/export_app_data.R on a schedule, and commits docs/app/data/app_data.json
# only if the data have changed. GitHub Pages then publishes the new file.
# It can also be run by hand: Actions tab > "Refresh app data" > Run workflow.
#
# The runner starts from a fresh clone, so data/mermaid_summ_ses.rds (which is
# not committed) does not exist and the script always downloads fresh data.

name: Refresh app data

on:
  schedule:
    - cron: "0 6 1 * *"    # 06:00 UTC on the 1st of each month
  workflow_dispatch:        # allows running it by hand from the Actions tab

permissions:
  contents: write           # to commit the refreshed data file
  pages: write              # to ask GitHub Pages to rebuild

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install R packages
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::here
            any::tidyverse
            any::jsonlite
            github::data-mermaid/mermaidr

      - name: Export the app data
        run: Rscript R/export_app_data.R

      - name: Commit the data file if it changed
        run: |
          # Compare with the committed file, ignoring the download and export
          # dates, which change on every run
          strip='del(.meta.downloaded, .meta.exported)'
          git show HEAD:docs/app/data/app_data.json 2>/dev/null | jq -S "$strip" > /tmp/old.json || true
          jq -S "$strip" docs/app/data/app_data.json > /tmp/new.json
          if cmp -s /tmp/old.json /tmp/new.json; then
            echo "The MERMAID data have not changed - nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/app/data/app_data.json
          git commit -m "Refresh app data from MERMAID ($(date -u +%Y-%m-%d))"
          git push
          # Ask GitHub Pages to rebuild, in case a push from this workflow does
          # not trigger it on its own
          gh api -X POST "repos/${{ github.repository }}/pages/builds" > /dev/null \
            && echo "Requested a GitHub Pages rebuild." \
            || echo "Could not request a Pages rebuild - it may start on its own."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
